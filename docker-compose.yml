services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: hacklab-juice-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - hacklab

  webgoat:
    image: webgoat/webgoat:latest
    container_name: hacklab-webgoat
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    networks:
      - hacklab

networks:
  hacklab:
    driver: bridge
